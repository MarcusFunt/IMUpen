name: SmartPen sprint 1
on:
  push:
    branches: ["main", "feature/esp32s3-lsm6ds3-sprint1"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q smartpen
      - run: python -m pytest -q tests/test_board_config.py tests/test_smartpen_protocol.py tests/test_smartpen_storage.py tests/test_smartpen_collector.py

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install platformio
      - run: pio run -d firmware
