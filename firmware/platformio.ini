[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
; These are example pins ONLY for a generic devkit. Change them to match
; the exact ESP32-S3 board and physical wiring before connecting the IMU.
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DIMU_SDA_PIN=8
  -DIMU_SCL_PIN=9
  -DIMU_I2C_HZ=400000
