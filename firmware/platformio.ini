[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 921600

; Seeed Studio XIAO ESP32-S3 exposed I2C pads:
; SDA = D4 / GPIO5
; SCL = D5 / GPIO6
; Uses the native USB port in USB CDC mode for binary packets.
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DIMU_SDA_PIN=5
  -DIMU_SCL_PIN=6
  -DIMU_I2C_HZ=400000
